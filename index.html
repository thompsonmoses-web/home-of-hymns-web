<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home of Hymns — Free Online Hymn Book (9,490 Hymns, 28 Denominations)</title>
  <meta name="description" content="Home of Hymns: a free online hymn book with 9,490 hymns and tunes across 28 denominations — Methodist, Catholic, Anglican, Lutheran, SDA, Yoruba translations and more. Search, read and sing anywhere.">
  <meta name="keywords" content="hymns, hymn book, free hymns, gospel hymns, hymn lyrics, online hymnary, church songs, Methodist hymns, Catholic hymns, Anglican hymns, SDA hymns, Yoruba hymns, hymns with tunes">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://home-of-hymns.onrender.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Home of Hymns — Free Online Hymn Book">
  <meta property="og:description" content="9,490 hymns with tunes across 28 denominations. Free, forever.">
  <meta property="og:url" content="https://home-of-hymns.onrender.com/">
  <meta property="og:image" content="https://home-of-hymns.onrender.com/assets/images/sing_logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Home of Hymns — Free Online Hymn Book">
  <meta name="twitter:description" content="9,490 hymns with tunes across 28 denominations. Free, forever.">
  <meta name="theme-color" content="#b91c1c">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Home of Hymns",
    "url": "https://home-of-hymns.onrender.com/",
    "applicationCategory": "MusicApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "description": "Free online hymn book with 9,490 hymns and tunes across 28 denominations.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="emblem.svg">
  <link rel="apple-touch-icon" href="assets/images/sing_logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="splash" class="overlay splash">
    <div class="splash-inner">
      <div class="splash-emblem">
        <img class="logo" data-logo src="emblem.svg" alt="Home of Hymns">
      </div>
      <div class="splash-glyphs">
        <svg class="bible-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="12" y1="7" x2="12" y2="17"/>
          <line x1="9" y1="10" x2="15" y2="10"/>
        </svg>
        <span class="splash-cross">✟</span>
      </div>
      <h1 class="splash-title">Home of Hymns</h1>
      <p class="splash-sub" data-t="Timeless Hymns for Every Generation">Timeless Hymns for Every Generation</p>
      <div class="loader"></div>
    </div>
  </div>

  <div id="entryGate" class="overlay entry-gate" hidden>
    <div class="gate-card">
      <button type="button" class="gate-emblem" id="gateAvatar" data-t-title="Add a profile photo" title="Add a profile photo">
        <img class="logo" data-logo src="emblem.svg" alt="Home of Hymns">
        <span class="photo-badge" aria-hidden="true">📷</span>
      </button>
      <button type="button" class="gate-photo-remove" id="gatePhotoRemove" data-t="Remove photo" hidden>Remove photo</button>
      <h2 class="gate-title" data-t="Welcome to Home of Hymns">Welcome to Home of Hymns</h2>
      <p class="gate-sub" data-t="Enter your details to continue">Enter your details to continue</p>
      <form id="gateForm" novalidate>
        <label class="gate-field">
          <span><span data-t="Full Name">Full Name</span> <b>*</b></span>
          <input type="text" id="gateName" autocomplete="name" data-t-ph="e.g. John Adeyemi" placeholder="e.g. John Adeyemi" maxlength="60" required>
        </label>
        <label class="gate-field">
          <span data-t="Phone or Email">Phone or Email</span>
          <input type="text" id="gateContact" autocomplete="tel" data-t-ph="Optional" placeholder="Optional" maxlength="80">
        </label>
        <label class="gate-field">
          <span data-t="Church / Branch">Church / Branch</span>
          <input type="text" id="gateChurch" data-t-ph="Optional" placeholder="Optional" maxlength="80">
        </label>
        <p class="gate-error" id="gateError" data-t="Please enter your name" hidden>Please enter your name</p>
        <button type="submit" class="gate-enter" id="gateEnter" data-t="Enter">Enter</button>
      </form>
      <p class="gate-note" data-t="Your details stay on this device.">Your details stay on this device.</p>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <img class="logo" data-logo src="emblem.svg" alt="Home of Hymns">
      <div class="brand-text">
        <h1>Home of Hymns</h1>
        <p data-t="Timeless Hymns for Every Generation">Timeless Hymns for Every Generation</p>
      </div>
    </div>

    <div class="topbar-controls">
      <button id="userChip" class="user-chip" hidden data-t-title="Your profile" title="Your profile"></button>
      <label class="font-control" data-t-title="Font size" title="Font size">
        <span class="aa">Aa</span>
        <input type="range" id="fontSize" min="14" max="34" value="19">
      </label>
      <label class="switch" data-t-title="Night mode" title="Night mode">
        <input type="checkbox" id="nightMode">
      </label>
      <button id="uiLangBtn" class="ui-lang-btn" data-t-title="Interface language" title="Interface language" aria-label="Interface language">
        <span class="uil" data-lang="en">EN</span><span class="uil" data-lang="yo">YO</span>
      </button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search" data-t-ph="Search title, number, lyrics, author..." placeholder="Search title, number, lyrics, author...">
      </div>
      <select id="langFilter" data-t-title="Filter by language" title="Filter by language">
        <option value="all" data-t="All Languages">All Languages</option>
      </select>
      <button id="jumpBtn" class="jump-btn" data-t-title="Jump to hymn number (/)" title="Jump to hymn number (/)"># <kbd>/</kbd></button>
    </div>
    <div class="jump" id="jumpBox" hidden>
      <span class="jump-prefix">#</span>
      <input id="jumpInput" inputmode="numeric" autocomplete="off" spellcheck="false" data-t-ph="Number" placeholder="Number" maxlength="4">
      <span id="jumpPreview" class="jump-preview"></span>
    </div>
    <div id="view" class="view"></div>
    <div id="collectionList" class="collection-strip hidden-rail" hidden></div>
  </main>

  <nav class="bottom-nav" aria-label="Views">
    <button class="nav-item active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span data-t="Home">Home</span>
    </button>
    <button class="nav-item" data-view="hymns">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      <span data-t="Hymns">Hymns</span>
    </button>
    <button class="nav-item" data-view="collections">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>
      <span data-t="Collections">Collections</span>
    </button>
    <button class="nav-item" data-view="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h13"/><path d="M3 12h9"/><path d="M3 16h13"/><path d="M19 6v12"/><path d="M21 8l-2-2-2 2"/></svg>
      <span data-t="Library">Library</span>
    </button>
    <button class="nav-item" data-view="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg>
      <span data-t="More">More</span>
    </button>
  </nav>

  <a href="privacy.html" id="privacyChip" data-t="Privacy" data-t-title="Privacy Policy" title="Privacy Policy" aria-label="Privacy Policy" style="position:fixed;left:8px;bottom:8px;z-index:60;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(28,25,23,.55);color:#fafaf9;text-decoration:none;backdrop-filter:blur(4px);opacity:.75">Privacy</a>

  <script src="logo.js"></script>
  <script src="data/hymns.js"></script>
  <script src="data/tunes.js"></script>
  <script src="data/tunes_meta.js"></script>
  <script src="data/yo.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
